# =============================================================================
# CRUNCHY-SQUARE - THÈME OFFICIEL FLUXBOX
# =============================================================================
# Harmonisé avec la suite officielle Crunchy (GTK 2/3/4, Labwc, IceWM) :
#   - Barres de titre sombres et sobres : #34332F vers #22211E
#   - Vert d'accentuation Crunchy : #35A854
#   - Menus à dégradé horizontal : #22211E vers #484741 (fond)
#   - Sélection de menu à dégradé horizontal vert : #206E33 vers #48DC6F
#   - Boutons carrés en relief Square Relief
# =============================================================================

! name:		Crunchy-Square
! author:	Benoit THIBAUD / Antigravity
! license:	GPL-3.0-or-later

*alpha:									255
*color:									#2e2e33
*colorTo:								#242320
*unfocus.color:							#242320
*unfocus.colorTo:						#1c1b19
*textColor:								#ffffff
*unfocus.textColor:						#888888

! WINDOW OPTIONS
!---------------
window.title.height:					26
window.bevelWidth:						2
window.font:							Ubuntu,Sans:size=10:bold
window.justify:							center
window.borderWidth:						1
window.borderColor:						#18181b
window.roundCorners:					TopLeft TopRight

window.button.focus.pixmap:				menu-focus.xpm
window.button.pressed.pixmap:			menu-pressed.xpm
window.button.unfocus.pixmap:			menu-unfocus.xpm

window.close.pixmap:					close-focus.xpm
window.close.unfocus.pixmap:			close-unfocus.xpm
window.close.pressed.pixmap:			close-pressed.xpm

window.maximize.pixmap:					maximize-focus.xpm
window.maximize.unfocus.pixmap:			maximize-unfocus.xpm
window.maximize.pressed.pixmap:			maximize-pressed.xpm

window.iconify.pixmap:					minimize-focus.xpm
window.iconify.unfocus.pixmap:			minimize-unfocus.xpm
window.iconify.pressed.pixmap:			minimize-pressed.xpm

window.shade.pixmap:					shade-focus.xpm
window.shade.unfocus.pixmap:			shade-unfocus.xpm
window.shade.pressed.pixmap:			shade-pressed.xpm

window.unshade.pixmap:					unshade-focus.xpm
window.unshade.unfocus.pixmap:			unshade-unfocus.xpm
window.unshade.pressed.pixmap:			unshade-pressed.xpm

window.stick.pixmap:					stick-focus.xpm
window.stick.unfocus.pixmap:			stick-unfocus.xpm
window.stick.pressed.pixmap:			stick-pressed.xpm

window.stuck.pixmap:					unstick-focus.xpm
window.stuck.unfocus.pixmap:			unstick-unfocus.xpm
window.stuck.pressed.pixmap:			unstick-pressed.xpm

window.grip.focus:						solid
window.grip.focus.color:				#242320
window.grip.unfocus:					solid
window.grip.unfocus.color:				#1c1b19

window.handle.focus:					solid
window.handle.focus.color:				#242320
window.handle.unfocus:					solid
window.handle.unfocus.color:			#1c1b19
window.handleWidth:						2

window.label.focus.pixmap:				label-background.xpm
window.label.unfocus.pixmap:			label-background.xpm
window.label.focus.textColor:			#ffffff
window.label.unfocus.textColor:			#888888

window.title.focus:						raised bevel1 gradient vertical
window.title.focus.pixmap:				title-background.xpm
window.title.unfocus:					raised bevel1 gradient vertical
window.title.unfocus.pixmap:			title-background.xpm

! MENU OPTIONS (Dégradés horizontaux parfaits)
!---------------------------------------------
menu.bevelWidth:						2
menu.borderColor:						#18181b
menu.borderWidth:						1
menu.bullet:							triangle
menu.bullet.position:					right

menu.frame:								flat gradient horizontal
menu.frame.color:						#22211e
menu.frame.colorTo:						#484741
menu.frame.disableColor:				#707070
menu.frame.font:						Ubuntu,Sans:size=10
menu.frame.justify:						left
menu.frame.textColor:					#ffffff

menu.hilite:							flat gradient horizontal
menu.hilite.color:						#206e33
menu.hilite.colorTo:					#48dc6f
menu.hilite.font:						Ubuntu,Sans:size=10:bold
menu.hilite.textColor:					#ffffff
menu.itemHeight:						12

menu.title:								flat gradient horizontal
menu.title.color:						#242320
menu.title.colorTo:						#4d4c46
menu.title.font:						Ubuntu,Sans:size=10:bold
menu.title.textColor:					#ffffff
menu.title.justify:						center
menu.titleHeight:						16
menu.roundCorners:						TopLeft TopRight

! TOOLBAR OPTIONS
!----------------
toolbar.height:							22
toolbar:								flat gradient vertical
toolbar.color:							#2e2e33
toolbar.colorTo:						#242320
toolbar.bevelWidth:						1
toolbar.borderColor:					#18181b
toolbar.borderWidth:					1

toolbar.clock:							flat solid
toolbar.clock.color:					#242320
toolbar.clock.font:						Ubuntu,Sans:size=10:bold
toolbar.clock.justify:					center
toolbar.clock.textColor:				#dadada

toolbar.workspace:						flat solid
toolbar.workspace.color:				#242320
toolbar.workspace.font:					Ubuntu,Sans:size=10:bold
toolbar.workspace.justify:				center
toolbar.workspace.textColor:			#dadada

toolbar.iconbar.focused:				flat gradient horizontal
toolbar.iconbar.focused.color:			#206e33
toolbar.iconbar.focused.colorTo:		#35a854
toolbar.iconbar.focused.borderColor:	#18181b
toolbar.iconbar.focused.borderWidth:	1
toolbar.iconbar.focused.font:			Ubuntu,Sans:size=10:bold
toolbar.iconbar.focused.justify:		center
toolbar.iconbar.focused.textColor:		#ffffff

toolbar.iconbar.unfocused:				flat gradient vertical
toolbar.iconbar.unfocused.color:		#2e2e33
toolbar.iconbar.unfocused.colorTo:		#242320
toolbar.iconbar.unfocused.borderColor:	#18181b
toolbar.iconbar.unfocused.borderWidth:	1
toolbar.iconbar.unfocused.font:			Ubuntu,Sans:size=10
toolbar.iconbar.unfocused.justify:		center
toolbar.iconbar.unfocused.textColor:	#888888

toolbar.iconbar.empty:					flat solid
toolbar.iconbar.empty.color:			#242320
