<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">
  <defs>
    <linearGradient id="btn_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#42413e" />
      <stop offset="15%" stop-color="#383734" />
      <stop offset="85%" stop-color="#2b2a28" />
      <stop offset="100%" stop-color="#22211f" />
    </linearGradient>
    <linearGradient id="btn_border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#54534f" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
  </defs>

  <!-- Ombre portée basse -->
  <rect x="2" y="3" width="16" height="16" rx="2.5" ry="2.5" fill="#18181b" opacity="0.55" />

  <!-- Corps biseauté en relief -->
  <rect x="2" y="2" width="16" height="16" rx="2.5" ry="2.5" fill="url(#btn_bg)" stroke="url(#btn_border)" stroke-width="1" />

  <!-- Ligne de brillance supérieure (biseau haut) -->
  <line x1="4.5" y1="3.5" x2="15.5" y2="3.5" stroke="#5c5b56" stroke-width="1" stroke-linecap="round" opacity="0.8" />
  <line x1="6" y1="13.5" x2="14" y2="13.5" stroke="#3c3b38" stroke-width="2.2" stroke-linecap="round" transform="translate(0, 0.7)" opacity="0.65" />
  <line x1="6" y1="13.5" x2="14" y2="13.5" stroke="#141312" stroke-width="2.2" stroke-linecap="round" />
</svg>
